name: bot

# Toutes les heures : une passe du bot (prix en direct, éventuels ordres fictifs), puis mise à jour
# de la page docs/index.html servie par GitHub Pages. L'état est enregistré dans le dépôt.
on:
  schedule:
    - cron: "2,17,32,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main          # toujours la dernière version, même pour une exécution restée en file d'attente
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Passe du bot
        run: python paper_trader.py --once
      - name: Page de suivi
        run: python dashboard.py
      - name: Enregistrer l'état
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git add -A
          # Toutes les 15 minutes le bot rejoue les bougies depuis le dernier état enregistré (résultat identique, quelle que soit
          # l'heure de la passe). On n'enregistre qu'environ une fois par heure, ou dès qu'un ordre a été passé.
          AGE=$(( $(date +%s) - $(git log -1 --format=%ct) ))
          if git diff --cached --quiet; then
            echo "Rien à enregistrer"
          elif [ "$AGE" -lt 3300 ] && git diff --cached --quiet -- paper_trades.csv; then
            echo "Passe intermédiaire, sans ordre : rien à enregistrer pour l'instant"
          else
            git commit -m "bot: état du $(date -u +'%Y-%m-%d %H:%M') UTC"
            for i in 1 2 3; do
              # en cas de modification simultanée du dépôt, la version la plus récente de l'état l'emporte
              git pull --rebase -X theirs && git push && exit 0
              git rebase --abort 2>/dev/null || true
              sleep 5
            done
            exit 1
          fi
